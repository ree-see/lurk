[package]
name = "lurk"
version = "0.1.0"
edition = "2021"
description = "A local-only keystroke logger for custom keyboard design analysis"
authors = ["reesee"]
license = "MIT"
repository = "https://github.com/reesee/lurk"
keywords = ["keyboard", "keylogger", "typing", "macos"]
categories = ["command-line-utilities"]

[dependencies]
# Database (SQLCipher for encryption)
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

# CLI & Configuration
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5.0"
libc = "0.2"

# Networking (client/server sync)
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
url = "2.5"

# TUI Dashboard
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(target_os = "macos")'.dependencies]
# Event capture (macOS only)
rdev = "0.5"

# macOS APIs — modern objc2 bindings replace deprecated cocoa/objc
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.2", features = ["NSString"] }
core-foundation = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
